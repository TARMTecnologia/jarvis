[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "JARVIS — Assistente Pessoal Multimodal Local para Desktop Windows"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "JARVIS Developer" }
]
dependencies = [
    "PySide6>=6.7.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "keyring>=25.0.0",
    "psutil>=6.0.0",
    "pillow>=10.4.0",
    "pyperclip>=1.9.0",
    "pyautogui>=0.9.54",
    "opencv-python>=4.10.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "pyttsx3>=2.90",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0"
]

[project.scripts]
jarvis = "app.main:main"
jarvis-doctor = "app.doctor:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
